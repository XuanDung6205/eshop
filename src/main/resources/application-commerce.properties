spring.application.name=eshop-commerce
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
logging.level.org.springframework.security=INFO
# Project defaults; prices already include tax. Only the server applies these fees.
commerce.checkout.shipping-fee=${CHECKOUT_SHIPPING_FEE:50000.00}
commerce.checkout.free-shipping-threshold=${CHECKOUT_FREE_SHIPPING_THRESHOLD:10000000.00}
commerce.checkout.assembly-unit-fee=${CHECKOUT_ASSEMBLY_UNIT_FEE:100000.00}
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.mariadb.autoconfigure.MariaDbStoreAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageAutoConfiguration
