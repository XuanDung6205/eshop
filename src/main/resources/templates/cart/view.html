<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giỏ hàng')}"></head>
<body data-track-page="cart">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container mb-5">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    
    <div class="d-flex align-items-center gap-2 mb-4">
        <h3 class="fw-bold mb-0"><i class="bi bi-cart3 text-primary me-2"></i>Giỏ hàng của bạn</h3>
    </div>

    <div th:if="${cart.empty}" class="card border-0 shadow-sm rounded-4 text-center py-5 bg-white">
        <div class="card-body">
            <i class="bi bi-cart-x text-muted display-3 mb-3"></i>
            <h5 class="fw-bold text-dark">Giỏ hàng của bạn đang trống</h5>
            <p class="text-muted">Hãy thêm những món đồ công nghệ yêu thích vào giỏ nhé!</p>
            <a class="btn btn-primary rounded-pill px-4 py-2 mt-2" th:href="@{/products}">
                <i class="bi bi-arrow-left me-1"></i>Khám phá sản phẩm ngay
            </a>
        </div>
    </div>

    <div th:unless="${cart.empty}">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4 bg-white">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="bg-light border-bottom">
                    <tr>
                        <th class="ps-4 py-3">Sản phẩm</th>
                        <th class="text-end py-3">Đơn giá</th>
                        <th style="width:190px" class="py-3 text-center">Số lượng</th>
                        <th class="text-end py-3 pe-4">Thành tiền</th>
                        <th class="py-3" style="width: 60px;"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="i : ${cart.items}" class="border-bottom">
                        <td class="ps-4 py-3">
                            <div class="d-flex align-items-center">
                                <img class="thumb rounded-3 me-3 border shadow-sm"
                                     th:src="${i.imageUrl}"
                                     alt=""
                                     onerror="this.onerror=null; this.src='/images/product-placeholder.svg';">
                                <div>
                                    <span class="fw-bold text-dark d-block" th:text="${i.name}"></span>
                                    <small class="text-muted">Mã: #<span th:text="${i.productId}"></span></small>
                                </div>
                            </div>
                        </td>
                        <td class="text-end fw-semibold text-secondary"
                            th:text="${#numbers.formatDecimal(i.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></td>
                        <td>
                            <form th:action="@{/cart/update}" method="post" class="d-flex justify-content-center gap-1"
                                  data-track-event="CART_UPDATE_CLICK">
                                <input type="hidden" name="productId" th:value="${i.productId}">
                                <input type="number" name="quantity" min="0"
                                       class="form-control form-control-sm text-center rounded-3 fw-bold"
                                       style="max-width: 75px;"
                                       th:value="${i.quantity}">
                                <button class="btn btn-sm btn-outline-primary rounded-3" title="Cập nhật số lượng">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </button>
                            </form>
                        </td>
                        <td class="text-end pe-4 price fw-bold fs-6"
                            th:text="${#numbers.formatDecimal(i.subtotal, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></td>
                        <td class="text-center pe-3">
                            <form th:action="@{/cart/remove/{id}(id=${i.productId})}" method="post"
                                  data-track-event="CART_REMOVE_CLICK" th:attr="data-track-product-id=${i.productId}">
                                <button class="btn btn-sm btn-outline-danger border-0 rounded-circle" title="Xoá khỏi giỏ">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot class="bg-light">
                    <tr>
                        <th colspan="3" class="ps-4 py-3 text-end fs-6">
                            Tổng thanh toán (<span class="text-primary fw-bold" th:text="${cart.totalQuantity}"></span> sản phẩm):
                        </th>
                        <th class="text-end pe-4 py-3 price fs-4 fw-bold"
                            th:text="${#numbers.formatDecimal(cart.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></th>
                        <th></th>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <form th:action="@{/cart/clear}" method="post" data-track-event="CART_CLEAR_CLICK">
                <button class="btn btn-outline-danger rounded-pill px-3 py-2 btn-sm">
                    <i class="bi bi-trash3 me-1"></i>Xoá toàn bộ giỏ hàng
                </button>
            </form>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary rounded-pill px-4 py-2" th:href="@{/products}">
                    <i class="bi bi-arrow-left me-1"></i>Tiếp tục mua hàng
                </a>
                <a class="btn btn-success rounded-pill px-4 py-2 fw-semibold shadow-sm" th:href="@{/checkout}">
                    Tiến hành thanh toán <i class="bi bi-arrow-right ms-1"></i>
                </a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
