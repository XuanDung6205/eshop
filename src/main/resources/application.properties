spring.application.name=eshop
server.port=8080

# ===== MariaDB =====
spring.datasource.url=jdbc:mariadb://localhost:3306/eshop
spring.datasource.username=root
spring.datasource.password=123

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/tracking-schema.sql
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== JWT =====
# Khoa bi mat Base64, toi thieu 256 bit (32 byte)
app.jwt.secret=N45bb7tsq8gOEJgSwlOh2QJ88qa66XO66l2+9pGjnM/YI0zwef4ob8hrFuifheOM
# Thoi han token: 1 ngay
app.jwt.expiration-ms=86400000

logging.level.org.springframework.security=DEBUG

# ===== Spring AI / Google Gemini Configuration =====
spring.ai.gemini.api-key=${GEMINI_API_KEY:}
spring.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.gemini.model=gemini-3.5-flash-lite
spring.ai.gemini.temperature=0.7

# Spring AI Google GenAI embeddings
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.task-type=SEMANTIC_SIMILARITY
spring.ai.google.genai.embedding.text.dimensions=768

# Spring AI MariaDB Vector Store (requires MariaDB 11.7+)
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=768
