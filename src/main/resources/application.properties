spring.application.name=eshop
server.port=8080

# ===== MariaDB =====
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/furniture_shop}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== JWT =====
# JWT_SECRET: khoa Base64 toi thieu 256 bit (32 byte), cap qua environment.
app.jwt.secret=${JWT_SECRET}
# Thoi han token: 1 ngay
app.jwt.expiration-ms=86400000

logging.level.org.springframework.security=DEBUG

# ===== Spring AI / Google Gemini Configuration =====
spring.ai.gemini.api-key=${GEMINI_API_KEY:}
spring.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.gemini.model=gemini-3.5-flash-lite
spring.ai.gemini.temperature=0.7

# Spring AI Google GenAI embeddings
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.task-type=SEMANTIC_SIMILARITY
spring.ai.google.genai.embedding.text.dimensions=768

# Spring AI MariaDB Vector Store (requires MariaDB 11.7+)
spring.ai.vectorstore.mariadb.initialize-schema=false
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=768
